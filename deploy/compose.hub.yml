# NEXARC installé par le Hub.
# Les {{...}} sont remplacés à l'installation : secrets générés, port d'hôte,
# volume nommé et réseau partagé du Hub.
services:
  nexarc:
    image: ghcr.io/codexx64/nexarc:{{config.IMAGE_TAG}}
    container_name: {{service.host}}
    restart: unless-stopped
    networks: [hub]
    ports:
      - "{{hostport.http}}:8090"
      - "{{hostport.consoles}}:8091"
    volumes:
      - {{volume.data}}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # Réveil réseau en émission directe (NEXARC_HOST_NET) : il faut alors le
    # réseau de l'hôte, ce qui ouvre le conteneur au réseau local — désactivé par
    # défaut. Sans lui, NEXARC réveille via un agent relais du même segment, ce
    # qui suffit et n'exige aucun privilège réseau : c'est pourquoi on garde le
    # réseau du Hub, isolé, plutôt que celui de l'hôte.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PORT: "8090"
      DATA_DIR: /data
      # Jeton de service du Hub : ouvre l'API (état, tâches, réveils), jamais les
      # comptes ni les réglages de sécurité.
      NEXARC_HUB_TOKEN: {{config.HUB_TOKEN}}
      NEXARC_PUBLIC_URL: "{{config.NEXARC_PUBLIC_URL}}"
      NEXARC_ALLOW_EXEC: "{{config.NEXARC_ALLOW_EXEC}}"
      NEXARC_MAX_MACHINES: "{{config.NEXARC_MAX_MACHINES}}"
      NEXARC_ALERT_OFFLINE_MINUTES: "{{config.NEXARC_ALERT_OFFLINE_MINUTES}}"
      NEXARC_ALERT_PATCH_DAYS: "{{config.NEXARC_ALERT_PATCH_DAYS}}"
      NEXARC_ALERT_DISK_PERCENT: "{{config.NEXARC_ALERT_DISK_PERCENT}}"
      NEXARC_ALERT_RISK: "{{config.NEXARC_ALERT_RISK}}"
      NEXARC_MESH_URL: "{{config.NEXARC_MESH_URL}}"
      NEXARC_MESH_USER: "{{config.NEXARC_MESH_USER}}"
      NEXARC_MESH_LOGIN_KEY: "{{config.NEXARC_MESH_LOGIN_KEY}}"
      NEXARC_MESH_EMBED: "{{config.NEXARC_MESH_EMBED}}"
      # Origine à part des consoles web : l'adresse par laquelle les navigateurs
      # joignent le second port. Vide : une carte s'ouvre dans un nouvel onglet.
      NEXARC_CONSOLE_URL: "{{config.NEXARC_CONSOLE_URL}}"
      # Comptes : clé maîtresse gardée par le Hub, accès HTTPS ou mode dégradé,
      # relais de confiance.
      SOCLE_CLE: "{{config.SOCLE_CLE}}"
      SOCLE_CLE_ANCIENNE: "{{config.SOCLE_CLE_ANCIENNE}}"
      SOCLE_HTTP: "{{config.SOCLE_HTTP}}"
      SOCLE_JETON_INSTALLATION: "{{config.SOCLE_JETON_INSTALLATION}}"
      # Gestion des comptes depuis le Hub (Comptes des services) : jeton à lui seul.
      SOCLE_JETON_ADMIN_HUB: "{{config.HUB_ADMIN_TOKEN}}"
      SOCLE_PROXYS: "{{config.SOCLE_PROXYS}}"
      SOCLE_ORIGINES: "{{config.SOCLE_ORIGINES}}"
      # Gamme de l'interface, choisie dans la page Thème du Hub.
      SOCLE_THEME: "{{hub.theme}}"
      # Alertes de sécurité par courriel, si un relais est indiqué.
      SOCLE_URL_PUBLIQUE: "{{config.SOCLE_URL_PUBLIQUE}}"
      SOCLE_SMTP_HOTE: "{{config.SOCLE_SMTP_HOTE}}"
      SOCLE_SMTP_PORT: "{{config.SOCLE_SMTP_PORT}}"
      SOCLE_SMTP_SECURITE: "{{config.SOCLE_SMTP_SECURITE}}"
      SOCLE_SMTP_UTILISATEUR: "{{config.SOCLE_SMTP_UTILISATEUR}}"
      SOCLE_SMTP_MOTDEPASSE: "{{config.SOCLE_SMTP_MOTDEPASSE}}"
      SOCLE_SMTP_DE: "{{config.SOCLE_SMTP_DE}}"
      # SYNAPSE, la mémoire du parc : NEXARC y raconte les machines enrôlées,
      # perdues et revenues, les tâches, les automatisations et les réveils. Le
      # jeton est un jeton de cerveau dérivé par le Hub, pour ce seul service.
      SYNAPSE_URL: "{{provider.memory.learn.url}}"
      SYNAPSE_JETON: "{{provider.memory.learn.jetonCerveau}}"

networks:
  hub:
    name: {{hub.network}}
    external: true

volumes:
  {{volume.data}}:
    name: {{volume.data}}
